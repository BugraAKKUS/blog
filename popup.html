<div id="popup-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
  <div style="background:#1a1a2e; border-radius:16px; padding:36px; max-width:420px; width:90%; position:relative; border:1px solid #4A9EFF33;">
    <button onclick="closePopup()" style="position:absolute; top:12px; right:16px; background:none; border:none; color:#888; font-size:20px; cursor:pointer;">✕</button>
    <h3 style="color:#4A9EFF; margin:0 0 8px 0; font-family:Inter,sans-serif;">Stay in the loop</h3>
    <p style="color:#aaa; font-size:14px; margin:0 0 20px 0; font-family:Inter,sans-serif;">Get an email when I publish a new post on ML, statistics or deep learning.</p>
    <form action="https://buttondown.com/api/emails/embed-subscribe/akkus" method="post" style="display:flex; flex-direction:column; gap:10px;">
      <input type="email" name="email" placeholder="your@email.com" required
        style="padding:10px 14px; border-radius:8px; border:1px solid #4A9EFF55; background:#0d1117; color:#e0e0e0; font-size:14px; outline:none;"/>
      <button type="submit"
        style="padding:10px; border-radius:8px; background:#4A9EFF; border:none; color:white; font-size:14px; font-weight:600; cursor:pointer;">
        Subscribe
      </button>
    </form>
    <p style="color:#555; font-size:11px; margin:12px 0 0 0; font-family:Inter,sans-serif;">No spam. Unsubscribe anytime.</p>
  </div>
</div>

<script>
  function closePopup() {
    document.getElementById('popup-overlay').style.display = 'none';
    localStorage.setItem('popupClosed', 'true');
  }

  window.addEventListener('load', function() {
    if (!localStorage.getItem('popupClosed')) {
      setTimeout(function() {
        const overlay = document.getElementById('popup-overlay');
        overlay.style.display = 'flex';
      }, 3000);
    }
  });
</script>
